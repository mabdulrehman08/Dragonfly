<!doctype html>
<html><head><meta charset="utf-8"><title>Dragonfly logo</title>
<style>html,body{margin:0;background:#0b0d10}body{width:1024px;height:1024px;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}</style>
</head><body>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#151a22"/><stop offset="100%" stop-color="#0b0d10"/>
    </radialGradient>
    <radialGradient id="ember" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff0a8"/><stop offset="30%" stop-color="#ff8a2a"/><stop offset="70%" stop-color="#ff3d1f" stop-opacity=".9"/><stop offset="100%" stop-color="#ff3d1f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="emberglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff5a1f" stop-opacity=".45"/><stop offset="100%" stop-color="#ff5a1f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9be0ff" stop-opacity=".85"/><stop offset="100%" stop-color="#5ac8fa" stop-opacity=".25"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8eaed"/><stop offset="100%" stop-color="#8b93a1"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9be0ff"/><stop offset="100%" stop-color="#5ac8fa" stop-opacity=".2"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="1024" height="1024" rx="180" fill="url(#bg)"/>

  <!-- ember below -->
  <circle cx="512" cy="730" r="210" fill="url(#emberglow)" filter="url(#blur)"/>
  <circle cx="512" cy="765" r="140" fill="url(#ember)"/>
  <path d="M512 640 C560 680 600 705 590 770 C580 830 540 850 512 860 C484 850 444 830 434 770 C424 705 464 680 512 640 Z" fill="#ff5a1f" opacity=".9"/>
  <path d="M512 690 C540 715 560 733 554 775 C548 812 528 826 512 833 C496 826 476 812 470 775 C464 733 484 715 512 690 Z" fill="#ffb347"/>
  <path d="M512 735 C526 750 536 762 533 783 C530 801 520 809 512 813 C504 809 494 801 491 783 C488 762 498 750 512 735 Z" fill="#fff2b0"/>

  <!-- water drop falling on the fire -->
  <g transform="translate(0 -6)"><path d="M512 618 C548 660 560 682 560 706 A48 48 0 1 1 464 706 C464 682 476 660 512 618 Z" fill="#9be0ff" opacity=".95" filter="url(#glow)"/><circle cx="498" cy="700" r="8" fill="#ffffff" opacity=".7"/></g>

  <!-- dragonfly-drone -->
  <g transform="translate(512 400)">
    <!-- rotor wings: four translucent ellipses like dragonfly wings, with rotor arcs -->
    <g fill="url(#wing)" stroke="#5ac8fa" stroke-width="3">
      <ellipse cx="-190" cy="-70" rx="170" ry="52" transform="rotate(-18 -190 -70)"/>
      <ellipse cx="190" cy="-70" rx="170" ry="52" transform="rotate(18 190 -70)"/>
      <ellipse cx="-175" cy="30" rx="150" ry="44" transform="rotate(8 -175 30)"/>
      <ellipse cx="175" cy="30" rx="150" ry="44" transform="rotate(-8 175 30)"/>
    </g>
    <!-- rotor hubs and blades -->
    <g stroke="#5ac8fa" stroke-width="4" fill="#0b0d10">
      <circle cx="-190" cy="-70" r="16"/><circle cx="190" cy="-70" r="16"/><circle cx="-175" cy="30" r="14"/><circle cx="175" cy="30" r="14"/>
    </g>
    <g stroke="#9be0ff" stroke-width="3" opacity=".9">
      <line x1="-250" y1="-90" x2="-130" y2="-50"/><line x1="130" y1="-50" x2="250" y2="-90"/>
      <line x1="-230" y1="40" x2="-120" y2="20"/><line x1="120" y1="20" x2="230" y2="40"/>
    </g>
    <!-- arms -->
    <g stroke="#c9d1d9" stroke-width="10" stroke-linecap="round">
      <line x1="-30" y1="-20" x2="-180" y2="-68"/><line x1="30" y1="-20" x2="180" y2="-68"/>
      <line x1="-30" y1="10" x2="-165" y2="30"/><line x1="30" y1="10" x2="165" y2="30"/>
    </g>
    <!-- body: long dragonfly abdomen -->
    <rect x="-22" y="-60" width="44" height="270" rx="22" fill="url(#body)"/>
    <g fill="#0b0d10" opacity=".35"><rect x="-22" y="20" width="44" height="6"/><rect x="-22" y="60" width="44" height="6"/><rect x="-22" y="100" width="44" height="6"/><rect x="-22" y="140" width="44" height="6"/><rect x="-22" y="180" width="44" height="6"/></g>
    <!-- head / sensor eye -->
    <circle cx="0" cy="-80" r="42" fill="#e8eaed"/>
    <circle cx="0" cy="-80" r="24" fill="#0b0d10"/>
    <circle cx="0" cy="-80" r="12" fill="#3ddc84" filter="url(#glow)"/>
    <!-- payload valve at tail -->
    <circle cx="0" cy="205" r="10" fill="#5ac8fa"/>
  </g>

  <!-- wordmark -->
  <text x="512" y="975" text-anchor="middle" fill="#e8eaed" font-size="96" font-weight="800" letter-spacing="-2">dragon<tspan fill="#ff5a1f">fly</tspan></text>
</svg>
</body></html>
